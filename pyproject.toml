[project]
name = "floodline"
version = "0.1.0"
description = "Flood extent, exposure and damage estimation from a DEM and a gauge"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Thomas Lin" }]
dependencies = [
    "numpy>=2.0",
    "numba>=0.61",
    "rasterio>=1.4",
    "rioxarray>=0.17",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyogrio>=0.10",
    "pyarrow>=17",
    "pydantic>=2.9",
    "pyproj>=3.6",
    "typer>=0.15",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
report = ["matplotlib>=3.9", "contextily>=1.6", "jinja2>=3.1"]
serve = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
]

[project.scripts]
floodline = "floodline.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-benchmark>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-geopandas>=1.1.4.20260807",
]
# Differential-test oracle only. Never imported by src/; the pipeline must not
# depend on it. Tests that use it skip when it is not installed.
oracle = [
    "pysheds>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/floodline"]

[tool.hatch.build.targets.wheel.force-include]
"src/floodline/web" = "floodline/web"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle / pyflakes
    "I",               # isort
    "N",               # pep8-naming
    "UP",              # pyupgrade
    "B",               # bugbear
    "A",               # builtins shadowing
    "C4",              # comprehensions
    "SIM",             # simplify
    "PTH",             # pathlib
    "RUF",
    "ANN",             # annotations
    "D",               # docstrings
]
ignore = [
    "D100",   # module docstring optional on private/test modules
    "D104",   # package docstring
    "D107",   # __init__ docstring (documented on the class)
    "ANN401", # allow Any where a public API genuinely takes it
    "N811",   # rasterio.crs.CRS / pyproj.CRS are classes, not constants; aliasing them is fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]
"notebooks/**" = ["D", "ANN", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["floodline"]
warn_unreachable = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["numba.*", "rasterio.*", "rioxarray.*", "contextily.*", "pyogrio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "slow: takes more than a second (JIT compile, large grids)",
    "differential: compares our implementation against pysheds/whitebox",
]
filterwarnings = [
    "error::DeprecationWarning:floodline.*",
    # rasterio 1.5 warns on its own internal use of `Affine * tuple`.
    "ignore:Use `@` matmul instead:PendingDeprecationWarning",
]
