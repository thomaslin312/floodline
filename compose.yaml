# Two services. There is no Redis and no worker, and that is a measurement rather than
# a preference: terrain routing takes 0.1 to 0.6 s across the sixteen validation basins
# and a scenario 5 to 52 ms. A queue would add a broker, a worker, a job table and a
# polling protocol in order to defer work that finishes before a poll interval elapses.
#
# The one slow step is fetching elevation, tens of seconds on a cold basin. That is
# handled by ordering - the cache is consulted before any fetch - not by deferral.
#
# Credentials come from `.env`, which is not committed. The `:?` forms below fail the
# stack with a named variable rather than starting a database on a password that is
# published in this file and identical on every deployment that ever copied it.
# `.env.example` says what to put there.

name: floodline

services:
  db:
    # arm64-native. `postgis/postgis` publishes amd64 only - 16-3.4 is a single-arch
    # image and even 17-3.5 has no arm64 manifest - so on Apple Silicon it runs under
    # emulation. Measured on this basin, ST_Intersects over 258,527 structures ran
    # 1,310 ms emulated against 502 ms native, and planning 55 ms against 17 ms - so
    # roughly 2.6x on the query the whole table exists to serve. (The images also
    # differ in PostGIS point release, 3.4.3 against 3.5.2, so that ratio is the
    # image change rather than the architecture alone.) This deployment is an
    # unattended Mac mini, where the emulation layer is a standing failure surface
    # bought for nothing.
    #
    # baosystems/postgis publishes linux/amd64 and linux/arm64 from the same source,
    # and stays on PostgreSQL 16, so this is an image change rather than a major
    # version upgrade: an existing data directory is readable and no pg_upgrade is
    # involved.
    image: ghcr.io/baosystems/postgis:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-floodline}
    # No published port. The API reaches this over the compose network by service
    # name; publishing 5432 put the database on every interface of the host for the
    # convenience of a psql session, which is a poor trade for a service holding a
    # quarter of a million rows per basin. `docker compose exec db psql` still works.
    # json-file with no options is unbounded, and this machine is expected to run
    # for months. Uvicorn logs a line per request, so the ceiling is set by traffic
    # rather than by anything in the image - 30 MB per service, which is enough to
    # investigate an incident and not enough to be the incident.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # pg_isready answers before PostGIS is loadable, so the check asks for the
      # extension a spatial query actually needs. A database that is up without
      # PostGIS accepts connections and fails every query, which is worse than down.
      # `$$` escapes the interpolation: the shell inside the container expands these,
      # not compose, so the credentials stay out of the rendered configuration.
      test:
        - CMD-SHELL
        - >-
          pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
          && psql -U $${POSTGRES_USER} -d $${POSTGRES_DB}
          -c 'SELECT postgis_version()' >/dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      FLOODLINE_DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-floodline}
      FLOODLINE_HAND_CACHE_DIR: /var/lib/floodline/hand
      FLOODLINE_CACHE_DIR: /var/lib/floodline/cache
      FLOODLINE_DATA_RAW: /var/lib/floodline/raw
      # The surveyed high-water marks, fetched once by `floodline prewarm`. This
      # has to be set alongside DATA_RAW: it is a separate setting with its own
      # relative default, so leaving it out puts the marks inside the image where
      # a restart loses them.
      FLOODLINE_MARKS_PATH: /var/lib/floodline/raw/validation/high_water_marks_national.json
      # The map's finished bundles. Without this they default to a path relative to
      # the working directory, which is inside the image rather than on the volume -
      # every restart would recompute what a visitor had already waited for.
      FLOODLINE_BUNDLE_CACHE_DIR: /var/lib/floodline/bundles
      # The largest grid this host will accept, against a default of 40M chosen for a
      # machine with far more memory than this one. Depression filling is global, so a
      # request holds its whole watershed resident; see mem_limit below for how the two
      # numbers are tied. Refusing a grid names the resolution and suggests a coarser
      # one, where an OOM kill takes every request in flight with it.
      FLOODLINE_MAX_CELLS: "15000000"
      # Cache budgets, also sized to this host. The defaults total 18 GiB, against
      # 24 GiB free on the host disk - and the eviction that enforces them cannot see
      # that, because inside the VM `df` reports 223 G with 200 G free. That number is
      # a sparse file growing against the host's 24 GiB, so the caches would evict on
      # schedule while the disk filled underneath them. A full disk is this machine's
      # documented failure mode: it wedged Docker five times during the build-out, and
      # Docker's own message was that it could not continue.
      #
      # 8 GiB total, leaving the host roughly 16 GiB for image and VM growth. Evicting
      # terrain costs a refetch of tens of seconds and inventory a refetch of minutes,
      # which is the right thing to spend to keep the disk from filling.
      FLOODLINE_TERRAIN_CACHE_BUDGET_MB: "4096"
      FLOODLINE_INVENTORY_CACHE_BUDGET_MB: "3072"
      FLOODLINE_BUNDLE_CACHE_BUDGET_MB: "1024"
    # json-file with no options is unbounded, and this machine is expected to run
    # for months. Uvicorn logs a line per request, so the ceiling is set by traffic
    # rather than by anything in the image - 30 MB per service, which is enough to
    # investigate an incident and not enough to be the incident.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # Loopback only. Caddy reaches this over the compose network; publishing it on
      # every interface put an unauthenticated endpoint that fetches from USGS on the
      # LAN. Bound here rather than removed so `docker/smoke.sh` and a local curl
      # still work on the machine itself.
      - "127.0.0.1:8000:8000"
    volumes:
      # The terrain cache is the point of the whole split; losing it on every restart
      # would mean paying for elevation again on every deploy.
      - floodline-data:/var/lib/floodline
    # Memory is the binding constraint here, not CPU: depression filling is global, so
    # a request holds its whole watershed grid resident, and that is why the image runs
    # one worker and the service caps itself at two computations in flight.
    #
    # The number is measured rather than guessed, from the container's own cgroup
    # high-water mark rather than from polling - `docker stats` samples, and a limit
    # has to cover the peak between two samples. Reading /sys/fs/cgroup/memory.peak
    # after a single request, on the same basin at two resolutions: 484 MiB at 1.10M
    # cells, 994 MiB at 9.94M, which fits 401 MiB fixed plus 57.7 bytes per cell.
    #
    # This was 6 GiB, from the same measurement carried to the service's own max_cells
    # ceiling of 40M: 401 MiB + 2 x 2.20 GiB = 4.69 GiB, plus headroom. That is sound
    # arithmetic about the software and says nothing about the machine, and the machine
    # is a Mac mini with 8 GB whose Docker VM gets 3.825 GiB. A limit larger than the VM
    # can never engage - the kernel OOM-kills the container first, which is the exact
    # failure the limit exists to replace with a refusal - so the cap was decorative.
    #
    # 2500 MiB is what fits beside PostGIS, cloudflared and the VM's own overhead inside
    # 3.825 GiB. FLOODLINE_MAX_CELLS above is lowered to 15M to match: 401 MiB + 2 x
    # 825 MiB = 2.00 GiB, about 19% under the cap. The two numbers have to move
    # together, or the service accepts work the cgroup will not let it finish.
    #
    # `core.config.PEAK_BYTES_PER_CELL` is 125 rather than 58, and deliberately: it
    # refuses work before anything has been measured, where erring high costs a run
    # and erring low costs the machine. Different job, different number.
    #
    # The point of the limit is that the container refuses work rather than being
    # OOM-killed: past the cap the concurrency limiter returns 503 with a Retry-After,
    # which a caller can act on, where the kernel's killer takes the whole process and
    # every request already in it.
    mem_limit: 2500m
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Liveness, not readiness: this must not fail because the database blinked, or
      # the orchestrator restarts a container that is doing its job.
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  proxy:
    # Only for a deployment that can accept inbound connections. This machine cannot -
    # it is behind a NAT nobody here administers - so the tunnel below is the route in
    # and Caddy would be a second proxy doing a job Cloudflare already does at its
    # edge. Kept, because a deployment that *can* forward 80 and 443 wants it and
    # should not have to reconstruct it: `docker compose --profile caddy up -d`.
    profiles: ["caddy"]
    build:
      context: .
      dockerfile: docker/Dockerfile.proxy
    restart: unless-stopped
    environment:
      # The hostname to serve, and where Let's Encrypt sends expiry warnings. Unset,
      # this is `localhost` on Caddy's internal CA - a browser warning, and fine for a
      # check on the machine itself.
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
      # Two substitutions rather than one so the directive disappears entirely when
      # ACME_EMAIL is unset: `email ` only when there is a value, then the value.
      # Caddy cannot parse a bare `email`, and a placeholder address would mean
      # registering a fake contact with Let's Encrypt.
      ACME_EMAIL_LINE: ${ACME_EMAIL:+email }${ACME_EMAIL:-}
      # Set ACME_STAGING=1 in .env to rehearse against Let's Encrypt's staging CA,
      # which does not spend the production rate limit. Unset it once a staging
      # certificate has been issued, and Caddy will fetch a real one.
      ACME_CA_LINE: ${ACME_STAGING:+acme_ca https://acme-staging-v02.api.letsencrypt.org/directory}
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3. Harmless if the router does not forward UDP; the client falls back.
      - "443:443/udp"
    volumes:
      # Certificates and ACME account keys. On a named volume because Let's Encrypt
      # rate-limits issuance per week, and a proxy that re-requests on every recreate
      # will hit that limit and then serve nothing.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # Caddy's admin API, which is bound to loopback inside the container.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  tunnel:
    # The way in on a network that accepts no inbound connections. cloudflared dials
    # *out* to Cloudflare and holds the connection open, so there is no port to
    # forward, no firewall exception to ask for, and no certificate to renew - TLS is
    # terminated at Cloudflare's edge. It also survives this machine's public address
    # changing, which on a campus network it will.
    #
    # The hostname-to-service mapping lives in the Cloudflare dashboard, not here:
    # floodline.app -> http://api:8000, where `api` is the service name on this
    # network. The token is all the container needs to know.
    #
    # Behind a profile because how a deployment is reached is a deployment's own
    # choice, and compose interpolates this whole file whatever is running: a
    # required TUNNEL_TOKEN broke every `docker compose exec` on a machine that had
    # not set one, including the smoke script's. Turn it on for good in `.env` with
    # COMPOSE_PROFILES=tunnel, and plain `docker compose up -d` includes it.
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2025.8.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  floodline-data:
  caddy-data:
  caddy-config:
