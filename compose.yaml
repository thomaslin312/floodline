# Two services. There is no Redis and no worker, and that is a measurement rather than
# a preference: terrain routing takes 0.1 to 0.6 s across the sixteen validation basins
# and a scenario 5 to 52 ms. A queue would add a broker, a worker, a job table and a
# polling protocol in order to defer work that finishes before a poll interval elapses.
#
# The one slow step is fetching elevation, tens of seconds on a cold basin. That is
# handled by ordering - the cache is consulted before any fetch - not by deferral.
#
# Credentials come from `.env`, which is not committed. The `:?` forms below fail the
# stack with a named variable rather than starting a database on a password that is
# published in this file and identical on every deployment that ever copied it.
# `.env.example` says what to put there.

name: floodline

services:
  db:
    # arm64-native. `postgis/postgis` publishes amd64 only - 16-3.4 is a single-arch
    # image and even 17-3.5 has no arm64 manifest - so on Apple Silicon it runs under
    # emulation. Measured on this basin, ST_Intersects over 258,527 structures ran
    # 1,310 ms emulated against 502 ms native, and planning 55 ms against 17 ms - so
    # roughly 2.6x on the query the whole table exists to serve. (The images also
    # differ in PostGIS point release, 3.4.3 against 3.5.2, so that ratio is the
    # image change rather than the architecture alone.) This deployment is an
    # unattended Mac mini, where the emulation layer is a standing failure surface
    # bought for nothing.
    #
    # baosystems/postgis publishes linux/amd64 and linux/arm64 from the same source,
    # and stays on PostgreSQL 16, so this is an image change rather than a major
    # version upgrade: an existing data directory is readable and no pg_upgrade is
    # involved.
    image: ghcr.io/baosystems/postgis:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-floodline}
    # No published port. The API reaches this over the compose network by service
    # name; publishing 5432 put the database on every interface of the host for the
    # convenience of a psql session, which is a poor trade for a service holding a
    # quarter of a million rows per basin. `docker compose exec db psql` still works.
    # json-file with no options is unbounded, and this machine is expected to run
    # for months. Uvicorn logs a line per request, so the ceiling is set by traffic
    # rather than by anything in the image - 30 MB per service, which is enough to
    # investigate an incident and not enough to be the incident.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # pg_isready answers before PostGIS is loadable, so the check asks for the
      # extension a spatial query actually needs. A database that is up without
      # PostGIS accepts connections and fails every query, which is worse than down.
      # `$$` escapes the interpolation: the shell inside the container expands these,
      # not compose, so the credentials stay out of the rendered configuration.
      test:
        - CMD-SHELL
        - >-
          pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
          && psql -U $${POSTGRES_USER} -d $${POSTGRES_DB}
          -c 'SELECT postgis_version()' >/dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      FLOODLINE_DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-floodline}
      FLOODLINE_HAND_CACHE_DIR: /var/lib/floodline/hand
      FLOODLINE_CACHE_DIR: /var/lib/floodline/cache
      FLOODLINE_DATA_RAW: /var/lib/floodline/raw
      # The surveyed high-water marks, fetched once by `floodline prewarm`. This
      # has to be set alongside DATA_RAW: it is a separate setting with its own
      # relative default, so leaving it out puts the marks inside the image where
      # a restart loses them.
      FLOODLINE_MARKS_PATH: /var/lib/floodline/raw/validation/high_water_marks_national.json
      # The map's finished bundles. Without this they default to a path relative to
      # the working directory, which is inside the image rather than on the volume -
      # every restart would recompute what a visitor had already waited for.
      FLOODLINE_BUNDLE_CACHE_DIR: /var/lib/floodline/bundles
    # json-file with no options is unbounded, and this machine is expected to run
    # for months. Uvicorn logs a line per request, so the ceiling is set by traffic
    # rather than by anything in the image - 30 MB per service, which is enough to
    # investigate an incident and not enough to be the incident.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8000:8000"
    volumes:
      # The terrain cache is the point of the whole split; losing it on every restart
      # would mean paying for elevation again on every deploy.
      - floodline-data:/var/lib/floodline
    # Memory is the binding constraint here, not CPU: depression filling is global, so
    # a request holds its whole watershed grid resident, and that is why the image runs
    # one worker and the service caps itself at two computations in flight.
    #
    # The number is measured rather than guessed, from the container's own cgroup
    # high-water mark rather than from polling - `docker stats` samples, and a limit
    # has to cover the peak between two samples. Reading /sys/fs/cgroup/memory.peak
    # after a single request, on the same basin at two resolutions: 484 MiB at 1.10M
    # cells, 994 MiB at 9.94M, which fits 401 MiB fixed plus 57.7 bytes per cell.
    #
    # At the service's own max_cells ceiling of 40M with its concurrency cap of 2,
    # that is 401 MiB + 2 x 2.20 GiB = 4.69 GiB, so 6 GiB is about 28% headroom for
    # allocator fragmentation and the transient copies inside the fill.
    #
    # `core.config.PEAK_BYTES_PER_CELL` is 125 rather than 58, and deliberately: it
    # refuses work before anything has been measured, where erring high costs a run
    # and erring low costs the machine. Different job, different number.
    #
    # The point of the limit is that the container refuses work rather than being
    # OOM-killed: past the cap the concurrency limiter returns 503 with a Retry-After,
    # which a caller can act on, where the kernel's killer takes the whole process and
    # every request already in it.
    mem_limit: 6g
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Liveness, not readiness: this must not fail because the database blinked, or
      # the orchestrator restarts a container that is doing its job.
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
  floodline-data:
