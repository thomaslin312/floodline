# ruff, mypy and pytest run as local hooks through `uv run` so the versions the
# hooks enforce are exactly the versions in uv.lock — no second source of truth.
# Generated output is not source, and hooks that tidy source corrupt it. The
# `trailing-whitespace` hook rewrote a minified bundle here, which changes the bytes
# CI compares against a fresh `npm run build` - a formatting hook quietly breaking the
# check that the committed build is real. The TypeScript it is built from is linted by
# `tsc` and tested by vitest in their own job.
exclude: '^src/floodline/web/dist/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy --strict src
        entry: uv run mypy --strict src
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      # Deselects the benchmarks. They take 170 s of the suite's 200 s and measure
      # runtime rather than correctness, so paying for them on every commit buys
      # nothing a developer acts on. CI runs the whole suite, benchmarks included.
      - id: pytest
        name: pytest -q (without benchmarks)
        entry: uv run pytest -q -m "not slow"
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
